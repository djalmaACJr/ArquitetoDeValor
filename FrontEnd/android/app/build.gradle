plugins {
    id 'com.android.application'
}

android {
    namespace = "br.com.arquitetodevalor.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "br.com.arquitetodevalor.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // versionCode precisa SEMPRE subir a cada instalação nova — é a
        // única coisa que o gerenciador de pacotes do Android usa pra saber
        // que o app mudou de verdade. Ficou travado em 1 desde o início do
        // projeto: mesmo com várias reinstalações via `gradlew installDebug`
        // com recursos diferentes (ex.: troca do ícone em b740702), o Android
        // via sempre "a mesma versão" e alguns caches do sistema/launcher
        // (o mais sensível a isso é o cache de ícone — inclusive o "Taskbar"
        // do One UI em tablets Samsung) não tinham motivo pra invalidar o
        // ícone antigo. versionName só é exibido pro usuário (Configurações
        // > Apps) — mantido igual ao APP_VERSION do app (ver ../../../version.ts).
        versionCode 3
        versionName "7.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            // Referencia explicitamente as regras do @capgo/capacitor-updater
            // (não declara consumerProguardFiles no próprio build.gradle, então
            // não seria puxado automaticamente) além do padrão do projeto —
            // sem isso o R8 pode remover/renomear classes do plugin acessadas
            // via reflection pela bridge nativa do Capacitor.
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro',
                '../../node_modules/@capgo/capacitor-updater/android/proguard-rules.pro'
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    // rootProject.ext.* explícito (não só "$variavel"): busca implícita de
    // propriedade em projeto pai está depreciada desde o Gradle 9 e vira
    // ERRO no Gradle 10 — essas versões só existem no ext{} do build.gradle
    // raiz (variables.gradle), nunca declaradas aqui em :app.
    implementation "androidx.appcompat:appcompat:${rootProject.ext.androidxAppCompatVersion}"
    implementation "androidx.coordinatorlayout:coordinatorlayout:${rootProject.ext.androidxCoordinatorLayoutVersion}"
    implementation "androidx.core:core-splashscreen:${rootProject.ext.coreSplashScreenVersion}"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:${rootProject.ext.junitVersion}"
    androidTestImplementation "androidx.test.ext:junit:${rootProject.ext.androidxJunitVersion}"
    androidTestImplementation "androidx.test.espresso:espresso-core:${rootProject.ext.androidxEspressoCoreVersion}"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception ignored) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

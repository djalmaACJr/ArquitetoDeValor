name: Backend — Testes de Integração da API

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  test:
    name: Rodar testes automatizados
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4.2.2

      - name: Configurar Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependências
        run: npm install

      - name: Rodar testes
        run: npm test -- --runInBand --verbose
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          # Segundo usuário para testes de RLS (cross-user isolation).
          # Sem isso, ~9 testes de segurança pulam graciosamente.
          # Cadastre como Secrets no GitHub: Settings → Secrets → Actions.
          TEST_EMAIL_B: ${{ secrets.TEST_EMAIL_B }}
          TEST_PASSWORD_B: ${{ secrets.TEST_PASSWORD_B }}

      - name: Salvar resultado dos testes
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: resultado-testes-${{ github.run_number }}
          path: test-results/
          if-no-files-found: ignore
